function obtenerLunesDeLaSemana(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay();
  const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
  const lunes = new Date(d);
  lunes.setDate(diff);
  return lunes.toISOString().slice(0, 10);
}

async function validarVentanaDeTurno() {
  if (!usuarioActual?.requiere_cierre_turno) return { permitido: true };

  const diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO'];
  const hoy = new Date();
  const diaHoy = diasSemana[hoy.getDay()];

  if ((usuarioActual.dias_libres || []).includes(diaHoy)) {
    return { permitido: false, razon: `Hoy (${diaHoy.toLowerCase()}) es tu día libre.` };
  }

  const semanaInicio = obtenerLunesDeLaSemana(hoy);
  const { data: fila } = await supabase
    .from('personal_horarios')
    .select('*')
    .eq('nombre_persona', usuarioActual.nombre)
    .eq('semana_inicio', semanaInicio)
    .eq('dia_semana', diaHoy)
    .maybeSingle();

  if (!fila || !fila.hora_salida) {
    return { permitido: false, razon: 'No tienes turno asignado hoy.' };
  }
  return { permitido: true, horaSalida: fila.hora_salida };
}

function semanaActual() {
  const hoy = new Date();
  const dia = hoy.getDay();
  const diff = hoy.getDate() - dia + (dia === 0 ? -6 : 1);
  return new Date(hoy.setDate(diff)).toISOString().slice(0, 10);
}

function estadoStock(cantidad) {
  if (cantidad < 0) return { clase: 'bg-rojoFluor text-white', valor: cantidad };
  if (cantidad <= 5) return { clase: 'bg-rojo/10 text-rojo', valor: cantidad };
  if (cantidad <= 8) return { clase: 'bg-amarillo/10 text-amarillo', valor: cantidad };
  return { clase: 'bg-verde/10 text-verde', valor: cantidad };
}

/** Normaliza mayúsculas/espacios antes de guardar, para que "Frambuesa" y "FRAMBUESA" sean siempre el mismo registro. */
function normalizarTexto(texto) {

function montarLogin() {
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('input-username').value.trim();
    const password = document.getElementById('input-password').value;
    const recordarme = document.getElementById('input-recordarme').checked;
    const errorEl = document.getElementById('error-login');
    errorEl.classList.add('hidden');

    const { data: correo, error: errBusqueda } = await supabase.rpc('obtener_correo_por_username', { p_username: username });
    if (errBusqueda || !correo) {
      errorEl.textContent = 'Usuario no encontrado.';
      errorEl.classList.remove('hidden');
      return;
    }

    // Reconstruimos el cliente con el almacenamiento correcto ANTES de iniciar sesión,
    // para que el token quede guardado en el lugar correcto (localStorage o sessionStorage).
    localStorage.setItem('cep_recordarme', String(recordarme));
    supabase = crearClienteConAlmacenamiento(recordarme);
    supabase.auth.onAuthStateChange(() => render());

    const { error } = await supabase.auth.signInWithPassword({ email: correo, password });
    if (error) {
      errorEl.textContent = 'Usuario o contraseña incorrectos.';
      errorEl.classList.remove('hidden');
      return;
    }
    usuarioActual = null;
    await render();
  });

  document.getElementById('btn-olvide-clave').addEventListener('click', async () => {
    const username = document.getElementById('input-username').value.trim();
    const errorEl = document.getElementById('error-login');
    const msgEl = document.getElementById('msg-login');
    errorEl.classList.add('hidden');
    msgEl.classList.add('hidden');

    if (!username) {
      errorEl.textContent = 'Primero escribe tu nombre de usuario arriba.';
      errorEl.classList.remove('hidden');
      return;
    }

    const { data: correo, error: errBusqueda } = await supabase.rpc('obtener_correo_por_username', { p_username: username });
    if (errBusqueda || !correo) {
      errorEl.textContent = 'Usuario no encontrado.';
      errorEl.classList.remove('hidden');
      return;
    }

    const { error } = await supabase.auth.resetPasswordForEmail(correo, { redirectTo: window.location.href });
    if (error) {
      errorEl.textContent = 'No se pudo enviar el correo: ' + error.message;
      errorEl.classList.remove('hidden');
      return;
    }
    msgEl.textContent = 'Te enviamos un correo con un link para crear una nueva contraseña.';
    msgEl.classList.remove('hidden');
  });
}

/** Renderiza una fila de movimiento, con ícono de editar/borrar si corresponde. */
function filaMovimientoDiario(m, puedeEditarSemana) {
  const positivo = m.cantidad > 0;
  const puedeEditarEste = puedeEditarSemana && (usuarioActual.rol === 'admin' || m.responsable.startsWith(usuarioActual.nombre));

        <span style="color:${positivo ? '#1D9E75' : '#E24B4A'}">${positivo ? '↗' : '↘'}</span>
      </span>
      <div class="flex-1">
        <p class="text-sm font-medium">${m.sabor} · ${m.tipo}</p>
        <p class="text-[10.5px] text-neutral-400">${m.responsable} · ${new Date(m.fecha).toLocaleString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</p>
      </div>
      <span class="text-sm font-medium" style="color:${positivo ? '#1D9E75' : '#E24B4A'}">${positivo ? '+' : ''}${m.cantidad} ${m.formato}</span>
      ${puedeEditarEste ? `<button data-editar-mov="${m.id}" data-mov-sabor="${m.sabor}" data-mov-tipo="${m.tipo}" data-mov-formato="${m.formato}" data-mov-cantidad="${m.cantidad}" class="btn-editar-mov p-1 text-neutral-400" aria-label="Editar movimiento">✏️</button>` : ''}
    </div>`;
}

/** Aplica los filtros activos de Diario a una lista de movimientos. */
function filtrarMovimientosDiario(movimientos) {
  return (movimientos || []).filter((m) => {
    if (filtroTipoDiario && m.tipo !== filtroTipoDiario) return false;
    if (filtroAccionDiario === 'entrada' && m.cantidad <= 0) return false;
    if (filtroAccionDiario === 'salida' && m.cantidad >= 0) return false;
    if (filtroResponsableDiario && !m.responsable.toLowerCase().includes(filtroResponsableDiario.toLowerCase())) return false;
    return true;
  });
}

    if (!sabor || !tipo || !formato || !cantidadRaw) {
      errorEl.textContent = 'Completa todos los campos.';
      errorEl.classList.remove('hidden');
      return;
    }

    const cantidad = campoAccion.value === 'salida' ? -Math.abs(cantidadRaw) : Math.abs(cantidadRaw);
    const { error } = await supabase.from('diario_movimientos').update({ sabor, tipo, formato, cantidad }).eq('id', m.id);
    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
      return;
    }
    contenedor.remove();
    await refrescarListaDiario();
  });
}

// ---------------- Carga de Excel semanal (reemplaza stock actual) ----------------

const FORMATO_SYROP_EXCEL = FORMATO_SYROP; // mismo mapa que ya usamos en el formulario

function formatoParaTipoSabor(sabor, tipo) {
  if (tipo === 'PULPA' || tipo === 'FRUTA') return 'KILO';
  if (tipo === 'CUBO' || tipo === 'FRAPPE') return 'BOLSA';
  if (tipo === 'BOLSA') return FORMATO_SYROP_EXCEL[sabor.toLowerCase()] || 'BOLSA';
  return 'UNIDAD';
}

/** Busca en el Excel una fila de encabezado con SABORES + al menos un tipo conocido, en cualquier hoja. */
function buscarTablaResumenEnExcel(workbook) {
  const tiposConocidos = ['BOLSA', 'CUBO', 'FRAPPE', 'FRUTA', 'PULPA'];
  for (const nombreHoja of workbook.SheetNames) {
    const hoja = workbook.Sheets[nombreHoja];
    const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: null });
    for (let r = 0; r < filas.length; r++) {
      const fila = (filas[r] || []).map((v) => (typeof v === 'string' ? v.trim().toUpperCase() : v));
      if (fila.includes('SABORES') && tiposConocidos.some((t) => fila.includes(t))) {
        const columnas = {};
        fila.forEach((v, idx) => { if (typeof v === 'string') columnas[v] = idx; });
        return { filas, filaEncabezado: r, columnas };
      }
    }
  }
  return null;
}

async function manejarArchivoExcel(file) {
  const estadoEl = document.getElementById('estado-carga-excel');
  estadoEl.className = 'px-4 pt-2 text-xs text-neutral-500';
  estadoEl.textContent = 'Leyendo archivo...';
  estadoEl.classList.remove('hidden');

  try {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array' });
    const tabla = buscarTablaResumenEnExcel(workbook);

    if (!tabla) {
      estadoEl.className = 'px-4 pt-2 text-xs text-rojo';
      estadoEl.textContent = 'No encontré una tabla con columna "SABORES" y tipos (BOLSA/CUBO/FRAPPE/FRUTA/PULPA) en este Excel.';
      return;
    }

    const tiposConocidos = ['BOLSA', 'CUBO', 'FRAPPE', 'FRUTA', 'PULPA'];
    const objetivos = []; // { sabor, tipo, cantidadNueva }
    for (let r = tabla.filaEncabezado + 1; r < tabla.filas.length; r++) {
      const fila = tabla.filas[r] || [];
      const sabor = fila[tabla.columnas['SABORES']];
      if (!sabor || typeof sabor !== 'string') continue;
      tiposConocidos.forEach((tipo) => {
        const col = tabla.columnas[tipo];
        if (col === undefined) return;
        const valor = fila[col];
        if (typeof valor === 'number') {
          objetivos.push({ sabor: sabor.trim().toUpperCase(), tipo, cantidadNueva: valor });
        }
      });
    }

    if (objetivos.length === 0) {
      estadoEl.className = 'px-4 pt-2 text-xs text-rojo';
      estadoEl.textContent = 'No encontré cantidades numéricas para cargar en ese archivo.';
      return;
    }

    const { data: stockActual } = await supabase.from('stock_global').select('*');
    const mapaActual = new Map((stockActual || []).map((s) => [`${s.sabor}||${s.tipo}`, s.total]));

    const ajustes = objetivos.map((o) => {
      const actual = mapaActual.get(`${o.sabor}||${o.tipo}`) || 0;
      const delta = o.cantidadNueva - actual;
      return { ...o, actual, delta };
    }).filter((a) => a.delta !== 0);

    if (ajustes.length === 0) {
      estadoEl.className = 'px-4 pt-2 text-xs text-neutral-500';
      estadoEl.textContent = 'El Excel coincide exactamente con el stock actual — no hay nada que ajustar.';
      return;
    }

    const resumenTexto = ajustes.map((a) => `${a.sabor} (${a.tipo}): ${a.actual} → ${a.cantidadNueva} (${a.delta > 0 ? '+' : ''}${a.delta})`).join('\n');
    const confirmar = window.confirm(`Se van a aplicar ${ajustes.length} ajustes para que el stock quede igual al Excel:\n\n${resumenTexto}\n\n¿Confirmas?`);
    if (!confirmar) {
      estadoEl.classList.add('hidden');
      return;
    }

    const semana = semanaActual();
    const filasParaInsertar = ajustes.map((a) => ({
      formato: formatoParaTipoSabor(a.sabor, a.tipo),
      sabor: a.sabor,
      tipo: a.tipo,
      cantidad: a.delta,
      responsable: `${usuarioActual.nombre} (ajuste por Excel)`,
      semana_inicio: semana
    }));

    const { error } = await supabase.from('diario_movimientos').insert(filasParaInsertar);
    if (error) {
      estadoEl.className = 'px-4 pt-2 text-xs text-rojo';
      estadoEl.textContent = error.message;
      return;
    }

    estadoEl.className = 'px-4 pt-2 text-xs text-verde';
    estadoEl.textContent = `✅ Stock actualizado: ${ajustes.length} productos ajustados según el Excel.`;
    document.getElementById('input-excel').value = '';
    setTimeout(() => vistaDiario(), 1200);
  } catch (err) {
    estadoEl.className = 'px-4 pt-2 text-xs text-rojo';
    estadoEl.textContent = 'No pude leer ese archivo: ' + err.message;
  }
}

// ---------------- Precios por Excel ----------------

/** Busca en cualquier hoja del Excel una fila de encabezado con columnas SABOR/SABORES y PRECIO/PRECIOS. */
function buscarTablaPreciosEnExcel(workbook) {
  for (const nombreHoja of workbook.SheetNames) {
    const hoja = workbook.Sheets[nombreHoja];
    const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: null });
    for (let r = 0; r < filas.length; r++) {
      const fila = (filas[r] || []).map((v) => (typeof v === 'string' ? v.trim().toUpperCase() : v));
      const colSabor = fila.findIndex((v) => v === 'SABOR' || v === 'SABORES');
      const colPrecio = fila.findIndex((v) => v === 'PRECIO' || v === 'PRECIOS');
      if (colSabor !== -1 && colPrecio !== -1) return { filas, filaEncabezado: r, colSabor, colPrecio };
    }
  }
  return null;
}

async function manejarArchivoExcelPrecios(file) {
  const estadoEl = document.getElementById('estado-carga-precios');
  estadoEl.className = 'px-0 pb-2 text-xs text-neutral-500';
  estadoEl.textContent = 'Leyendo archivo...';
  estadoEl.classList.remove('hidden');

  try {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array' });
    const tabla = buscarTablaPreciosEnExcel(workbook);

    if (!tabla) {
      estadoEl.className = 'px-0 pb-2 text-xs text-rojo';
      estadoEl.textContent = 'No encontré una tabla con columnas SABOR y PRECIO en este Excel.';
      return;
    }

    const { data: preciosActuales } = await supabase.from('precios_sabores').select('*');
    const mapaActual = new Map((preciosActuales || []).map((p) => [p.sabor.trim().toUpperCase(), p.precio]));

    const objetivos = [];
    for (let r = tabla.filaEncabezado + 1; r < tabla.filas.length; r++) {
      const fila = tabla.filas[r] || [];
      const sabor = fila[tabla.colSabor];
      const precio = fila[tabla.colPrecio];
      if (!sabor || typeof sabor !== 'string') continue;
      if (typeof precio !== 'number') continue;
      objetivos.push({ sabor: sabor.trim().toUpperCase(), precio });
    }

    if (objetivos.length === 0) {
      estadoEl.className = 'px-0 pb-2 text-xs text-rojo';
      estadoEl.textContent = 'No encontré filas con sabor y precio numérico en ese archivo.';
      return;
    }

    const cambios = objetivos.filter((o) => mapaActual.get(o.sabor) !== o.precio);
    if (cambios.length === 0) {
      estadoEl.className = 'px-0 pb-2 text-xs text-neutral-500';
      estadoEl.textContent = 'El Excel coincide exactamente con los precios actuales — no hay nada que actualizar.';
      return;
    }

    const resumenTexto = cambios.map((c) => {
      const actual = mapaActual.get(c.sabor);
      return `${c.sabor}: ${actual !== undefined ? '$' + actual : 'sin precio'} → $${c.precio}`;
    }).join('\n');
    const confirmar = window.confirm(`Se van a actualizar ${cambios.length} precios:\n\n${resumenTexto}\n\n¿Confirmas?`);
    if (!confirmar) {
      estadoEl.classList.add('hidden');
      return;
    }

    const filasParaGuardar = cambios.map((c) => ({
      sabor: c.sabor, precio: c.precio, actualizado_por: `${usuarioActual.nombre} (Excel)`, updated_at: new Date().toISOString()
    }));
    const { error } = await supabase.from('precios_sabores').upsert(filasParaGuardar, { onConflict: 'sabor' });
    if (error) {
      estadoEl.className = 'px-0 pb-2 text-xs text-rojo';
      estadoEl.textContent = error.message;
      return;
    }

    estadoEl.className = 'px-0 pb-2 text-xs text-verde';
    estadoEl.textContent = `✅ ${cambios.length} precios actualizados.`;
    document.getElementById('input-excel-precios').value = '';
    setTimeout(() => vistaConfiguracion(), 1200);
  } catch (err) {
    estadoEl.className = 'px-0 pb-2 text-xs text-rojo';
    estadoEl.textContent = 'No pude leer ese archivo: ' + err.message;
  }

// ---------------- Frutería (tabla semanal producto × día) ----------------

const DIAS_SEMANA_ORDEN = ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO'];
const DIAS_SEMANA_CORTO = { LUNES: 'L', MARTES: 'M', MIERCOLES: 'X', JUEVES: 'J', VIERNES: 'V', SABADO: 'S', DOMINGO: 'D' };
const COLORES_GRUPO_FRUTERIA = ['bg-rojo/10 text-rojo', 'bg-marca-light text-marca', 'bg-amarillo/10 text-amarillo', 'bg-verde/10 text-verde'];

/** Arma la tabla semanal producto × día (como el Excel de "PROVEEDORES"), agrupada por proveedor. */
function tablaFruteriaHtml(compras, opciones = {}) {
  const soloLectura = !!opciones.soloLectura;
  if (!compras.length) return `<p class="px-4 py-6 text-center text-sm text-neutral-400">Aún no hay compras registradas esta semana.</p>`;

  const grupos = new Map(); // proveedor -> Map(clave -> fila)
  compras.forEach((c) => {
    const proveedor = c.proveedor || 'Sin proveedor';
    if (!grupos.has(proveedor)) grupos.set(proveedor, new Map());
    const productos = grupos.get(proveedor);
    const clave = c.producto + '|' + c.formato;
    if (!productos.has(clave)) productos.set(clave, { producto: c.producto, formato: c.formato, proveedor: c.proveedor || '', porDia: {}, total: 0 });
    const fila = productos.get(clave);
    const previo = fila.porDia[c.dia_semana]?.cantidad || 0;
    fila.porDia[c.dia_semana] = { cantidad: previo + Number(c.cantidad) };
    fila.total += Number(c.cantidad);
  });

  const bloques = [...grupos.entries()].map(([proveedor, productos], i) => {
    const color = COLORES_GRUPO_FRUTERIA[i % COLORES_GRUPO_FRUTERIA.length];
    const filas = [...productos.values()].map((f) => `
      <tr>
        <td class="sticky left-0 z-10 bg-white px-2 py-1.5 text-left text-xs font-medium">${f.producto}</td>
        <td class="px-1 py-1.5 text-center text-[10px] text-neutral-400">${f.formato}</td>
        ${DIAS_SEMANA_ORDEN.map((d) => {
          const celda = f.porDia[d];
          return `<td ${soloLectura ? '' : `data-celda-fruteria data-producto="${f.producto}" data-formato="${f.formato}" data-proveedor="${f.proveedor}" data-dia="${d}" data-cantidad-actual="${celda ? celda.cantidad : ''}"`} class="${soloLectura ? '' : 'cursor-pointer active:bg-marca-light'} border-l border-neutral-100 px-1 py-1.5 text-center text-xs ${celda ? '' : 'text-neutral-300'}">${celda ? celda.cantidad : '-'}</td>`;
        }).join('')}
        <td class="border-l border-neutral-200 bg-neutral-50 px-2 py-1.5 text-center text-xs font-semibold">${f.total}</td>
      </tr>`).join('');
    return `<tr><td colspan="${DIAS_SEMANA_ORDEN.length + 3}" class="${color} px-2 py-1 text-[11px] font-semibold">${proveedor}</td></tr>${filas}`;
  }).join('');

  return `
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-xs">
        <thead>
          <tr class="border-b border-neutral-200">
            <th class="sticky left-0 z-10 bg-white px-2 py-1.5 text-left text-[10px] text-neutral-500">Producto</th>
            <th class="px-1 py-1.5 text-[10px] text-neutral-500">Fmt</th>
            ${DIAS_SEMANA_ORDEN.map((d) => `<th class="border-l border-neutral-100 px-1 py-1.5 text-[10px] text-neutral-500">${DIAS_SEMANA_CORTO[d]}</th>`).join('')}
            <th class="border-l border-neutral-200 px-2 py-1.5 text-[10px] text-neutral-500">Total</th>
          </tr>
        </thead>
        <tbody>${bloques}</tbody>
      </table>
    </div>`;
}

/** Permite tocar una celda de la tabla para agregar/editar/borrar la cantidad de ese producto ese día. */
function montarListenersTablaFruteria(semana, alGuardar) {
  document.querySelectorAll('[data-celda-fruteria]').forEach((celda) => {
    celda.addEventListener('click', async () => {
      const producto = celda.dataset.producto;
      const formato = celda.dataset.formato;
      const proveedor = celda.dataset.proveedor || null;
      const dia = celda.dataset.dia;
      const actual = celda.dataset.cantidadActual;
      const texto = window.prompt(`${producto} (${formato}) — ${dia}\nCantidad (deja vacío para borrar):`, actual);
      if (texto === null) return;

      const { data: existentes } = await supabase.from('compras_semanales').select('*')
        .eq('semana_inicio', semana).eq('producto', producto).eq('formato', formato).eq('dia_semana', dia);

      if (texto.trim() === '') {
        if (existentes && existentes.length) {
          const { error } = await supabase.from('compras_semanales').delete().in('id', existentes.map((e) => e.id));
          if (error) return alert('No se pudo borrar: ' + error.message);
        }
        return alGuardar();
      }

      const cantidad = Number(texto);
      if (Number.isNaN(cantidad)) return alert('Escribe solo un número.');

      if (existentes && existentes.length) {
        const { error } = await supabase.from('compras_semanales').update({ cantidad }).eq('id', existentes[0].id);
        if (error) return alert('No se pudo actualizar: ' + error.message);
        if (existentes.length > 1) await supabase.from('compras_semanales').delete().in('id', existentes.slice(1).map((e) => e.id));
      } else {
        const { error } = await supabase.from('compras_semanales').insert([{
          semana_inicio: semana, producto, formato, proveedor, dia_semana: dia, cantidad, registrado_por: usuarioActual.nombre
        }]);
        if (error) return alert('No se pudo registrar: ' + error.message);
      }
      alGuardar();
    });
  });
}

async function vistaProduccion() {
  const { data: lotes } = await supabase.from('produccion_mezclas').select('*').order('fecha_ingreso', { ascending: true });
  const activos = (lotes || []).filter((l) => l.estado !== 'terminado');
  const enCamara = activos.filter((l) => l.ubicacion === 'CAMARA');
  const enSalon = activos.filter((l) => l.ubicacion === 'SALON');
  const permitido = puedeEscribir('produccion');

  function filaLote(l) {
    const fecha = new Date(l.fecha_ingreso).toLocaleDateString('es-CL', { day: '2-digit', month: 'short' });
    const bloques = [l.bloques_uni1, l.bloques_uni2, l.bloques_uni3, l.bloques_uni4].filter(Boolean).join('/');
    return `<div class="flex items-center justify-between border-b border-neutral-100 py-2">
      <div>
        <p class="text-sm font-medium">${l.sabor} + ${l.complemento} ${l.estado === 'proxima' ? '<span class="ml-1 rounded-full bg-marca-light px-2 py-0.5 text-[10px] text-marca">próxima</span>' : ''}</p>
        <p class="text-[11px] text-neutral-400">Bloques: ${bloques} · ${fecha}</p>
      </div>
      <div class="flex items-center gap-1">
        ${permitido && l.ubicacion === 'SALON' ? `<button data-finalizar-lote="${l.id}" data-lote-sabor="${l.sabor}" data-lote-complemento="${l.complemento}" class="btn-finalizar-lote rounded-full border border-marca px-2 py-1 text-[10px] font-medium text-marca" aria-label="Finalizar y calificar">Finalizar</button>` : ''}
        ${permitido ? `<button data-editar-fecha-lote="${l.id}" data-fecha-actual="${l.fecha_ingreso}" class="btn-editar-fecha p-1 text-neutral-400" aria-label="Editar fecha">📅</button>` : ''}
      </div>
    </div>`;
  }

  app.innerHTML = shell('Producción', `
    ${permitido ? `
      <div class="flex justify-end gap-2 px-4 pt-3">
        <button id="btn-en-uso" class="rounded-full border border-neutral-200 px-3 py-1.5 text-xs font-medium text-neutral-600">En uso</button>
        <button id="btn-nueva-mezcla" class="rounded-full bg-marca px-3 py-1.5 text-xs font-medium text-white">+ Nueva mezcla</button>
      </div>` : ''}
    <section class="px-4 pt-4">
      <p class="mb-2 text-xs font-medium text-neutral-500">❄️ EN CÁMARA (más antiguo primero)</p>
      ${enCamara.length ? enCamara.map(filaLote).join('') : '<p class="text-xs text-neutral-400">— vacío —</p>'}
    </section>
    <section class="px-4 pt-5">
      <p class="mb-2 text-xs font-medium text-neutral-500">🏠 EN SALÓN (en uso)</p>
      ${enSalon.length ? enSalon.map(filaLote).join('') : '<p class="text-xs text-neutral-400">— vacío —</p>'}
    </section>
    <section class="px-4 pt-5">
      <button id="btn-ir-historial" class="flex w-full items-center justify-between rounded-xl border border-neutral-200 px-3 py-2.5 text-xs font-medium text-neutral-600">
        <span>⭐ Historial de sabores realizados</span>
        <span>→</span>
      </button>
    </section>
    ${permitido ? panelNuevaMezclaHtml() : ''}
    ${permitido ? panelEnUsoHtml(enCamara) : ''}
  `);
  montarShell();
  document.getElementById('btn-ir-historial').addEventListener('click', () => cambiarPantalla('historial'));
  if (permitido) {
    document.getElementById('btn-nueva-mezcla').addEventListener('click', () => document.getElementById('panel-nueva-mezcla').classList.toggle('hidden'));
    document.getElementById('btn-en-uso').addEventListener('click', () => document.getElementById('panel-en-uso').classList.toggle('hidden'));
    montarFormularioProduccion();
    montarPanelEnUso();

    document.querySelectorAll('.btn-editar-fecha').forEach((btn) => {
      btn.addEventListener('click', () => {
        const loteId = btn.dataset.editarFechaLote;
        const fechaActual = btn.dataset.fechaActual;
        abrirSelectorFecha(fechaActual, async (nuevaFecha) => {
          if (!nuevaFecha) return;
          const { error } = await supabase.from('produccion_mezclas').update({ fecha_ingreso: nuevaFecha }).eq('id', loteId);
          if (error) return alert('No se pudo actualizar la fecha: ' + error.message);
          await vistaProduccion();
        });
      });
    });

    document.querySelectorAll('.btn-finalizar-lote').forEach((btn) => {
      btn.addEventListener('click', () => {
        abrirModalCalificar({
          id: btn.dataset.finalizarLote,
          sabor: btn.dataset.loteSabor,
          complemento: btn.dataset.loteComplemento,
          calificacionActual: null,
          modo: 'finalizar'
        }, vistaProduccion);
      });
    });
  }
}

        <button id="btn-confirmar-calificar" class="h-9 flex-1 rounded-lg bg-marca text-xs font-medium text-white">${lote.modo === 'finalizar' ? 'Finalizar' : 'Guardar'}</button>
      </div>
    </div>`;
  document.body.appendChild(contenedor);

  const pickerEl = document.getElementById('estrellas-picker');
  function pintarEstrellas() {
    pickerEl.innerHTML = [1, 2, 3, 4, 5].map((n) =>
      `<button type="button" data-estrella="${n}" class="leading-none ${n <= seleccion ? 'text-amarillo' : 'text-neutral-200'}">★</button>`
    ).join('');
    pickerEl.querySelectorAll('[data-estrella]').forEach((btn) => {
      btn.addEventListener('click', () => { seleccion = Number(btn.dataset.estrella); pintarEstrellas(); });
    });
  }
  pintarEstrellas();

  document.getElementById('btn-cancelar-calificar').addEventListener('click', () => contenedor.remove());

  document.getElementById('btn-confirmar-calificar').addEventListener('click', async () => {
    const errorEl = document.getElementById('calificar-error');
    errorEl.classList.add('hidden');
    if (!seleccion) {
      errorEl.textContent = 'Toca una estrella para calificar.';
      errorEl.classList.remove('hidden');
      return;
    }
    const cambios = { calificacion: seleccion };
    if (lote.modo === 'finalizar') {
      cambios.estado = 'terminado';
      cambios.ubicacion = 'SALON';
      cambios.finalizado_en = new Date().toISOString();
      cambios.calificado_por = usuarioActual.nombre;
    }
    const { error } = await supabase.from('produccion_mezclas').update(cambios).eq('id', lote.id);
    if (error) {
      errorEl.textContent = 'No se pudo guardar: ' + error.message;
      errorEl.classList.remove('hidden');
      return;
    }
    contenedor.remove();
    if (alConfirmar) await alConfirmar();
  });
}

// ---------------- Historial de sabores ----------------

let filtroHistorial = '';

async function vistaHistorial() {
  const permitido = puedeEscribir('produccion');
  const { data: terminados } = await supabase
    .from('produccion_mezclas')
    .select('*')
    .eq('estado', 'terminado')
    .order('finalizado_en', { ascending: false });

  const lista = terminados || [];
  const filtrados = filtroHistorial
    ? lista.filter((l) => `${l.sabor} ${l.complemento}`.toLowerCase().includes(filtroHistorial.toLowerCase()))
    : lista;

  // Promedio por combinación sabor + complemento, para ver qué mezclas repetir.
  const promedios = {};
  lista.forEach((l) => {
    const clave = `${l.sabor} + ${l.complemento}`;
    if (!promedios[clave]) promedios[clave] = { suma: 0, n: 0 };
    promedios[clave].suma += l.calificacion || 0;
    promedios[clave].n += 1;
  });
  const rankingTop = Object.entries(promedios)
    .map(([clave, v]) => ({ clave, promedio: v.suma / v.n, n: v.n }))
    .sort((a, b) => b.promedio - a.promedio)
    .slice(0, 5);

  function estrellasTexto(n) {
    return `<span class="text-amarillo">${'★'.repeat(n)}</span><span class="text-neutral-200">${'★'.repeat(5 - n)}</span>`;
  }

  document.getElementById('app').innerHTML = shell('Historial de sabores', `
    <section class="px-4 pt-4">
      <input id="input-filtro-historial" type="text" placeholder="Buscar sabor…" value="${filtroHistorial}" class="mb-4" />
    </section>

    ${rankingTop.length ? `
    <section class="px-4 pb-2">
      <p class="mb-2 text-xs font-medium text-neutral-500">🏆 MEJOR RECIBIDOS</p>
      <div class="flex flex-col gap-1.5 rounded-xl border border-neutral-100 p-3">
        ${rankingTop.map((r) => `
          <div class="flex items-center justify-between text-xs">
            <span>${r.clave}</span>
            <span>${estrellasTexto(Math.round(r.promedio))} <span class="text-neutral-400">(${r.n})</span></span>
          </div>`).join('')}
      </div>
    </section>` : ''}

    <section class="px-4 pt-4">
      <p class="mb-2 text-xs font-medium text-neutral-500">REGISTRO</p>
      ${filtrados.length ? filtrados.map((l) => {
        const fecha = l.finalizado_en ? new Date(l.finalizado_en).toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
        return `<div class="flex items-center justify-between border-b border-neutral-100 py-2.5">
          <div>
            <p class="text-sm font-medium">${l.sabor} + ${l.complemento}</p>
            <p class="text-[11px] text-neutral-400">Finalizado ${fecha}${l.calificado_por ? ' · ' + l.calificado_por : ''}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm">${estrellasTexto(l.calificacion || 0)}</span>
            ${permitido ? `<button data-editar-calificacion="${l.id}" data-sabor="${l.sabor}" data-complemento="${l.complemento}" data-calificacion="${l.calificacion || 0}" class="btn-editar-calificacion p-1 text-neutral-400" aria-label="Editar calificación">✏️</button>` : ''}
          </div>
        </div>`;
      }).join('') : '<p class="text-xs text-neutral-400">— aún no hay sabores finalizados —</p>'}
    </section>
  `);
  montarShell();

  document.getElementById('input-filtro-historial').addEventListener('input', (e) => {
    filtroHistorial = e.target.value;
    vistaHistorial();
  });

  document.querySelectorAll('.btn-editar-calificacion').forEach((btn) => {
    btn.addEventListener('click', () => {
      abrirModalCalificar({
        id: btn.dataset.editarCalificacion,
        sabor: btn.dataset.sabor,
        complemento: btn.dataset.complemento,
        calificacionActual: Number(btn.dataset.calificacion),
        modo: 'editar'
      }, vistaHistorial);
    });
  });
}

let vistaResumenActual = 'tarjetas';
let abiertoResumen = null;

let modoResumen = 'congelados';

async function vistaResumen() {
  if (modoResumen === 'fruteria') return vistaResumenFruteria();

  const { data: movimientos } = await supabase.from('diario_movimientos').select('sabor, tipo, cantidad, responsable').eq('semana_inicio', semanaActual());
  const filas = movimientos || [];
  const totalEntradas = filas.filter((f) => f.cantidad > 0).reduce((a, f) => a + f.cantidad, 0);
  const totalSalidas = filas.filter((f) => f.cantidad < 0).reduce((a, f) => a + Math.abs(f.cantidad), 0);

  const mapa = new Map();
  filas.forEach((f) => {
    if (!mapa.has(f.sabor)) mapa.set(f.sabor, { sabor: f.sabor, total: 0, tipos: new Set(), detalle: [] });
    const e = mapa.get(f.sabor);
    e.total += f.cantidad;
    e.tipos.add(f.tipo);
    e.detalle.push({ tipo: f.tipo, cantidad: f.cantidad });
  });
  const porSabor = [...mapa.values()].map((s) => ({ ...s, tipos: [...s.tipos] })).sort((a, b) => a.sabor.localeCompare(b.sabor));
  const tiposUnicos = [...new Set(filas.map((f) => f.tipo))].sort();

    ${toggleModoResumenHtml()}

      </div>

    <p id="msg-compartir" class="hidden px-4 pt-2 text-xs text-verde">Resumen copiado — pégalo en WhatsApp.</p>
    <div id="contenido-resumen"></div>

  document.getElementById('btn-vista-tabla').addEventListener('click', () => { vistaResumenActual = 'tabla'; vistaResumen(); });
  document.getElementById('btn-compartir-resumen').addEventListener('click', () => compartirResumenTexto(porSabor, totalEntradas, totalSalidas));
  document.getElementById('btn-actualizar-resumen').addEventListener('click', () => vistaResumen());

  const contenedor = document.getElementById('contenido-resumen');
  if (vistaResumenActual === 'tarjetas') {
    contenedor.innerHTML = porSabor.length ? porSabor.map((s) => {
      const est = estadoStock(s.total);
      const abierto = abiertoResumen === s.sabor;
      return `
        <div>
          <button data-sabor="${s.sabor}" class="btn-toggle-sabor flex w-full items-center gap-3 border-b border-neutral-100 px-2 py-2 text-left">
            <span class="flex-1"><span class="block text-sm font-medium">${s.sabor}</span><span class="block text-[10.5px] text-neutral-400">${s.tipos.join(' · ')}</span></span>
            <span class="rounded-full px-2.5 py-0.5 text-xs font-medium ${est.clase}">${s.total}</span>

        return `<td class="px-2.5 py-1.5 text-center text-neutral-500">${encontrado ? encontrado.cantidad : '—'}</td>`;

/**
 * Arma un texto simple, sin tecnicismos, para compartir por WhatsApp con personas
 * que no usan la plataforma (ej. Victor, Nayareth como jefes que solo quieren ver el resultado).
 */
async function compartirResumenTexto(porSabor, totalEntradas, totalSalidas) {
  const fecha = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' });

  function emojiEstado(total) {
    if (total < 0) return '🟣'; // negativo / rojo flúor
    if (total <= 5) return '🔴';
    if (total <= 8) return '🟡';
    return '🟢';
  }

  let texto = `📋 *Resumen de existencias — ${fecha}*\n\n`;
  texto += `↗ Entradas: ${totalEntradas}   ↘ Salidas: ${totalSalidas}\n\n`;
  porSabor.forEach((s) => {
    texto += `${emojiEstado(s.total)} ${s.sabor}: ${s.total}\n`;
  });
  texto += `\n_Generado por Control de Existencias y Producciones — Mateo Peralta_`;

  const msgEl = document.getElementById('msg-compartir');

  if (navigator.share) {
    try {
      await navigator.share({ title: 'Resumen de existencias', text: texto });
      return;
    } catch (e) {
      // el usuario canceló el share o el navegador lo rechazó; seguimos al respaldo de copiar
    }
  }

  try {
    await navigator.clipboard.writeText(texto);
    msgEl.classList.remove('hidden');
    setTimeout(() => msgEl.classList.add('hidden'), 3000);
  } catch (e) {
    alert(texto); // último respaldo si ni share ni clipboard funcionan
  }
}

  document.getElementById('btn-certificar')?.addEventListener('click', async () => {
    const { error } = await supabase.from('certificaciones_semanales').insert([{ semana_inicio: semana, certificado_por: usuarioActual.nombre }]);
    if (!error) {
      descargarPdfExistencias(items);
      await vistaGlobal();
    }
  });

  const cont = document.getElementById('lista-global');

  if (laminaActual === 'produccion') {
    cont.innerHTML = lotesProduccion.length ? lotesProduccion.map((l) => {
      const totalBloques = [l.bloques_uni1, l.bloques_uni2, l.bloques_uni3, l.bloques_uni4].reduce((a, b) => a + (b || 0), 0);
      const est = estadoStock(totalBloques);
      const colorBarra = totalBloques < 0 ? '#FF1744' : totalBloques <= 5 ? '#E24B4A' : totalBloques <= 8 ? '#EF9F27' : '#1D9E75';
      const fecha = new Date(l.fecha_ingreso).toLocaleDateString('es-CL', { day: '2-digit', month: 'short' });
      return `
        <div class="flex items-center gap-3 border-b border-neutral-100 px-2 py-2">
          <span class="h-full w-1 self-stretch rounded" style="background-color:${colorBarra}"></span>
          <span class="flex-1">
            <span class="block text-sm font-medium">${l.sabor} + ${l.complemento}</span>
            <span class="block text-[10.5px] text-neutral-400">${l.ubicacion === 'CAMARA' ? '❄️ Cámara' : '🏠 Salón'} · ${fecha}</span>
          </span>
          <span class="rounded-full px-2.5 py-0.5 text-xs font-medium ${est.clase}">${totalBloques}</span>
        </div>`;
    }).join('') : `<p class="px-4 py-6 text-center text-sm text-neutral-400">No hay producción registrada.</p>`;
    return;
  }

  if (laminaActual === 'fruteria') {
    cont.innerHTML = tablaFruteriaHtml(comprasSemana, { soloLectura: true });
    return;
  }

  const tiposActivos = LAMINAS[laminaActual].tipos;
  const filtrados = items.filter((i) => tiposActivos.includes(i.tipo) && (!filtroTipoGlobal || i.tipo === filtroTipoGlobal));
  const puedeEditar = puedeEscribir('diario');
  cont.innerHTML = filtrados.length ? filtrados.map((item) => {
    const est = estadoStock(item.total);
    const colorBarra = item.total < 0 ? '#FF1744' : item.total <= 5 ? '#E24B4A' : item.total <= 8 ? '#EF9F27' : '#1D9E75';
    return `
      <div class="flex items-center gap-3 border-b border-neutral-100 px-2 py-2">
        <span class="h-full w-1 self-stretch rounded" style="background-color:${colorBarra}"></span>
        <span class="flex-1"><span class="block text-sm font-medium">${item.sabor}</span><span class="block text-[10.5px] text-neutral-400">${item.tipo}</span></span>
        <span class="rounded-full px-2.5 py-0.5 text-xs font-medium ${est.clase}">${item.total}</span>
        ${puedeEditar ? `<button data-editar-sabor="${item.sabor}" data-editar-tipo="${item.tipo}" data-editar-actual="${item.total}" class="btn-editar-existencia p-1 text-neutral-400" aria-label="Editar existencia">✏️</button>` : ''}
      </div>`;
  }).join('') : `<p class="px-4 py-6 text-center text-sm text-neutral-400">Sin productos en esta lámina.</p>`;

  document.querySelectorAll('.btn-editar-existencia').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const sabor = btn.dataset.editarSabor;
      const tipo = btn.dataset.editarTipo;
      const actual = Number(btn.dataset.editarActual);
      const nuevoTexto = window.prompt(`Cantidad real de ${sabor} (${tipo}):`, actual);
      if (nuevoTexto === null) return;
      const nuevo = Number(nuevoTexto);
      if (Number.isNaN(nuevo)) return alert('Escribe solo un número.');
      const delta = nuevo - actual;
      if (delta === 0) return;

      const { error } = await supabase.from('diario_movimientos').insert([{
        formato: formatoParaTipoSabor(sabor, tipo),
        sabor, tipo, cantidad: delta,
        responsable: `${usuarioActual.nombre} (ajuste manual)`,
        semana_inicio: semanaActual()
      }]);
      if (error) return alert('No se pudo ajustar: ' + error.message);
      await vistaGlobal();
    });
  });
}

/** Filtra los items según lo elegido en "Exportar reporte" (Todo / Pulpas y frutas / Syrops / Hielo). */
function itemsParaExportar(items) {
  if (filtroExportar === 'todo') return items;
  const tipos = LAMINAS[filtroExportar]?.tipos || [];
  return items.filter((i) => tipos.includes(i.tipo));
}

/** Arma el HTML del reporte (reutilizado tanto por el PDF como por la captura de pantalla). */
function construirHtmlReporte(items, fecha, certificadoPor) {
  const filasHtml = items.map((i) => {
    const c = colorPdfPorCantidad(i.total);
    return `<tr style="background:${c.bg};color:${c.color}">
      <td style="font-weight:700">${i.sabor}</td>
      <td style="font-weight:500">${i.tipo}</td>
      <td style="text-align:right;font-weight:700;font-size:14px">${i.total}</td>
    </tr>`;
  }).join('');

  // Marca de agua repetida en diagonal, de fondo, en todo el documento.
  const marcaDeAgua = `
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;">
      <div style="position:absolute;inset:-50%;display:flex;flex-wrap:wrap;gap:60px;transform:rotate(-30deg);opacity:0.07;">
        ${Array.from({ length: 40 }).map(() => `<span style="font-size:20px;font-weight:700;color:#8B3A5C;white-space:nowrap;">MATEO PERALTA</span>`).join('')}
      </div>
    </div>`;

  return `
    <div style="position:relative;">
      ${marcaDeAgua}
      <div style="position:relative;z-index:1;">
        <h1 style="color:#8B3A5C;font-size:18px;margin-bottom:2px">Control de Existencias y Producciones</h1>
        <p style="color:#888;font-size:12px;margin-top:0">Existencias globales — generado el ${fecha} por ${usuarioActual.nombre}</p>
        ${certificadoPor ? `<p style="color:#1D9E75;font-weight:600;font-size:12px">✅ Certificado por ${certificadoPor}</p>` : ''}
        <div style="display:flex;gap:14px;margin-top:14px;font-size:11px;color:#555">
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#1D9E75"></span>9 o más</span>
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#EF9F27"></span>6 a 8</span>
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#E24B4A"></span>0 a 5</span>
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:#FF1744"></span>Negativo</span>
        </div>
        <table style="width:100%;border-collapse:separate;border-spacing:0 4px;margin-top:16px">
          <thead><tr style="background:none">
            <th style="padding:9px 12px;font-size:12.5px;text-align:left;color:#888;font-weight:500;border-bottom:2px solid #ddd">Sabor</th>
            <th style="padding:9px 12px;font-size:12.5px;text-align:left;color:#888;font-weight:500;border-bottom:2px solid #ddd">Tipo</th>
            <th style="padding:9px 12px;font-size:12.5px;text-align:right;color:#888;font-weight:500;border-bottom:2px solid #ddd">Cantidad</th>
          </tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>
    </div>`;
}

/** Genera una imagen PNG (captura de pantalla) del reporte, usando html2canvas sobre un contenedor oculto. */
async function capturarPantallaExistencias(items, certificadoPor = null) {
  const fecha = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' });

  const contenedor = document.createElement('div');
  contenedor.style.cssText = 'position:fixed;left:-9999px;top:0;width:520px;background:#fff;padding:24px;font-family:Arial,sans-serif;color:#222';
  contenedor.innerHTML = construirHtmlReporte(items, fecha, certificadoPor);
  document.body.appendChild(contenedor);

  try {
    const canvas = await html2canvas(contenedor, { backgroundColor: '#ffffff', scale: 2 });
    const enlace = document.createElement('a');
    enlace.download = `existencias_${fecha.replace(/ /g, '_')}.png`;
    enlace.href = canvas.toDataURL('image/png');
    enlace.click();
  } catch (err) {
    alert('No se pudo generar la captura: ' + err.message);
  } finally {
    contenedor.remove();
  }
}

function colorPdfPorCantidad(total) {
  if (total < 0) return { bg: '#FF1744', color: '#ffffff' };
  if (total <= 5) return { bg: '#E24B4A', color: '#ffffff' };
  if (total <= 8) return { bg: '#EF9F27', color: '#ffffff' };
  return { bg: '#1D9E75', color: '#ffffff' };
}

function descargarPdfExistencias(items, certificadoPor = null) {
  const fecha = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' });

  const ventana = window.open('', '_blank');
  ventana.document.write(`
    <html><head><title>Existencias — ${fecha}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#222}
      @media print { body{padding:12px} }
    </style></head>
    <body>${construirHtmlReporte(items, fecha, certificadoPor)}</body></html>
  `);
  ventana.document.close();
  ventana.focus();
  setTimeout(() => ventana.print(), 300);
}

  const temaActual = temaGuardado();
  const tamanoActual = tamanoLetraGuardado();
  const opcionesTamano = [
    { valor: 'chico', etiqueta: 'Chico' },

    { valor: 'grande', etiqueta: 'Grande' },
    { valor: 'muy-grande', etiqueta: 'Muy grande' }
  ];

  let saboresConPrecio = [];

    const { data: stock } = await supabase.from('stock_global').select('sabor').order('sabor');
    const { data: precios } = await supabase.from('precios_sabores').select('*');
    const mapaPrecios = new Map((precios || []).map((p) => [p.sabor.trim().toUpperCase(), p.precio]));
    const saboresUnicos = [...new Set((stock || []).map((s) => s.sabor))];
    saboresConPrecio = saboresUnicos.map((s) => ({ sabor: s, precio: mapaPrecios.get(s.trim().toUpperCase()) || '' }));

    const { data: cert } = await supabase.from('certificaciones_semanales').select('*').eq('semana_inicio', semanaActual()).maybeSingle();
    certificacionActual = cert;
  }

  app.innerHTML = shell('Configuración', `
    <div class="flex flex-col gap-6 p-4">
      <div>
        <p class="mb-3 text-sm font-medium">Apariencia</p>
        <div class="flex items-center justify-between border-b border-neutral-100 py-2">
          <span class="text-sm text-neutral-600">Modo oscuro</span>
          <button id="btn-toggle-oscuro" class="text-2xl ${temaActual === 'oscuro' ? 'text-marca' : 'text-neutral-400'}">${temaActual === 'oscuro' ? '●' : '○'}</button>
        </div>
        <p class="mt-3 mb-2 text-xs text-neutral-500">Tamaño de letra</p>
        <div class="flex gap-2">
          ${opcionesTamano.map((o) => `<button data-tamano="${o.valor}" class="btn-tamano rounded-full px-3 py-1.5 text-xs ${tamanoActual === o.valor ? 'bg-marca text-white' : 'border border-neutral-200 text-neutral-500'}">${o.etiqueta}</button>`).join('')}
        </div>
        <p class="mt-2 text-[10.5px] text-neutral-400">Se guarda en este dispositivo.</p>
      </div>

      ${esAdmin ? `
      <div>
        <p class="mb-1 text-sm font-medium">Certificación de esta semana</p>
        ${certificacionActual
          ? `<p class="mb-2 text-xs text-neutral-600">✅ Certificada por <b>${certificacionActual.certificado_por}</b> el ${new Date(certificacionActual.certificado_en).toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' })}.</p>
             <button id="btn-descertificar" class="h-9 rounded-lg border border-rojo text-rojo px-4 text-xs font-medium">Descertificar semana actual</button>
             <p class="mt-2 text-[10.5px] text-neutral-400">Al descertificar, se vuelve a permitir editar/borrar los movimientos de esta semana.</p>`
          : `<p class="text-xs text-neutral-400">Esta semana aún no está certificada.</p>`
        }
      </div>

      <div>
        <p class="mb-1 text-sm font-medium">Rangos de alerta de stock</p>
        <p class="mb-3 text-[11px] text-neutral-400">Verde: 9+ · Amarillo: 6-8 · Rojo: 0-5 · Rojo flúor: negativos.</p>
        <p class="text-[11px] text-neutral-400">La edición de estos rangos está disponible en la versión Next.js del proyecto.</p>
      </div>

      <div>
        <p class="mb-1 text-sm font-medium">Precios por sabor</p>
        <p class="mb-3 text-[11px] text-neutral-400">Se usan para calcular el valor total de existencias en Global.</p>

        <label class="mb-1 block text-xs text-neutral-500">Cargar desde Excel (columnas SABOR / PRECIO)</label>
        <input id="input-excel-precios" type="file" accept=".xlsx,.xls" class="mb-1" />
        <p id="estado-carga-precios" class="hidden px-0 pb-2 text-xs"></p>

        <div class="my-3 flex items-center gap-2">
          <div class="h-px flex-1 bg-neutral-100"></div>
          <span class="text-[10.5px] text-neutral-400">o edítalos a mano</span>
          <div class="h-px flex-1 bg-neutral-100"></div>
        </div>

        <form id="form-precios" class="flex flex-col gap-2">
          ${saboresConPrecio.map((s) => `
            <div class="flex items-center gap-2">
              <span class="flex-1 text-xs">${s.sabor}</span>
              <input type="number" name="precio-${s.sabor}" value="${s.precio}" placeholder="$" class="w-28" />
            </div>`).join('')}
          <p id="msg-precios" class="hidden text-xs text-verde mt-1">Precios guardados.</p>
          <button type="submit" class="mt-2 h-9 rounded-lg bg-marca text-xs font-medium text-white">Guardar precios</button>
        </form>
      </div>

      <div class="rounded-xl border border-rojo/30 p-3">
        <p class="mb-1 text-sm font-medium text-rojo">Zona de riesgo</p>
        <p class="mb-3 text-[11px] text-neutral-400">Borra TODOS los movimientos, producción, compras y certificaciones — para partir de cero al terminar la marcha blanca. No borra usuarios, precios ni horarios. No se puede deshacer.</p>

    aplicarTema(temaGuardado() === 'oscuro' ? 'claro' : 'oscuro');

  });
  document.querySelectorAll('.btn-tamano').forEach((btn) => {
    btn.addEventListener('click', () => {
      aplicarTamanoLetra(btn.dataset.tamano);
      vistaConfiguracion();
    });
  });

  document.getElementById('input-excel-precios')?.addEventListener('change', (e) => {
    const file = e.target.files[0];

  });

  document.getElementById('form-precios')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const filas = [];
    for (const [nombreCampo, valor] of formData.entries()) {
      if (!nombreCampo.startsWith('precio-') || valor === '') continue;
      const sabor = nombreCampo.replace('precio-', '');
      filas.push({ sabor: sabor.toUpperCase(), precio: Number(valor), actualizado_por: usuarioActual.nombre, updated_at: new Date().toISOString() });

    if (filas.length === 0) return;
    const { error } = await supabase.from('precios_sabores').upsert(filas, { onConflict: 'sabor' });

    if (!error) {
      msgEl.classList.remove('hidden');
      setTimeout(() => msgEl.classList.add('hidden'), 2500);
    }
  });

    const confirmar = window.confirm('¿Descertificar la semana actual? Esto vuelve a permitir editar o borrar sus movimientos.');

    const { error } = await supabase.from('certificaciones_semanales').delete().eq('semana_inicio', semanaActual());

  document.getElementById('btn-abrir-reinicio')?.addEventListener('click', abrirModalReinicio);

/** Modal de doble confirmación para el reinicio total de existencias (solo admin). */
function abrirModalReinicio() {
  const existente = document.getElementById('modal-reinicio');
  if (existente) existente.remove();

  const contenedor = document.createElement('div');
  contenedor.id = 'modal-reinicio';
  contenedor.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4';
  contenedor.innerHTML = `
    <div class="w-full max-w-xs rounded-xl bg-white p-4">
      <p class="mb-2 text-sm font-medium text-rojo">Reiniciar existencias</p>
      <p class="mb-3 text-xs text-neutral-600">Esto borra permanentemente: todos los movimientos del Diario, toda la Producción, Compras semanales y Certificaciones. No se puede deshacer.</p>
      <label class="mb-3 flex items-start gap-2 text-xs text-neutral-600">
        <input type="checkbox" id="chk-reinicio-entiendo" class="mt-0.5" />
        Entiendo que esta acción no se puede deshacer.
      </label>
      <label class="mb-1 block text-xs text-neutral-500">Escribe REINICIAR para confirmar</label>
      <input id="input-reinicio-confirmar" type="text" class="mb-3" autocomplete="off" />
      <p id="reinicio-error" class="hidden text-xs text-rojo mb-2"></p>
      <div class="flex gap-2">
        <button id="btn-cancelar-reinicio" class="h-9 flex-1 rounded-lg border border-neutral-200 text-xs text-neutral-500">Cancelar</button>
        <button id="btn-confirmar-reinicio" class="h-9 flex-1 rounded-lg bg-rojo text-xs font-medium text-white">Reiniciar</button>
      </div>
    </div>`;
  document.body.appendChild(contenedor);

  document.getElementById('btn-cancelar-reinicio').addEventListener('click', () => contenedor.remove());

  document.getElementById('btn-confirmar-reinicio').addEventListener('click', async () => {
    const errorEl = document.getElementById('reinicio-error');
    errorEl.classList.add('hidden');
    const entiendo = document.getElementById('chk-reinicio-entiendo').checked;
    const texto = document.getElementById('input-reinicio-confirmar').value.trim().toUpperCase();
    if (!entiendo || texto !== 'REINICIAR') {
      errorEl.textContent = 'Marca la casilla y escribe REINICIAR (en mayúsculas) para confirmar.';
      errorEl.classList.remove('hidden');
      return;
    }
    const btn = document.getElementById('btn-confirmar-reinicio');
    btn.disabled = true;
    btn.textContent = 'Reiniciando…';
    try {
      await ejecutarReinicioExistencias();
      contenedor.remove();
      alert('Existencias reiniciadas. Listo para partir con datos reales.');
      await vistaConfiguracion();
    } catch (err) {
      errorEl.textContent = 'No se pudo reiniciar: ' + err.message;
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Reiniciar';
    }
  });
}

/** Borra, en el orden correcto (por llaves foráneas), todo lo acumulado durante la marcha blanca. */
async function ejecutarReinicioExistencias() {
  const tablas = ['produccion_movimientos', 'produccion_mezclas', 'diario_movimientos', 'certificaciones_semanales', 'compras_semanales'];
  for (const tabla of tablas) {
    const { error } = await supabase.from(tabla).delete().gte('id', 0);
    if (error) throw error;
  }
}
